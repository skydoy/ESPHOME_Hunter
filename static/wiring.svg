<text x="40" y="554" font-size="16" font-weight="700" fill="#111">What each wire does</text>
<line x1="40" y1="579" x2="70" y2="579" stroke="#d62828" stroke-width="5" stroke-linecap="round"/>
<text x="82" y="584" font-size="13" font-weight="700" fill="#d62828">VAC-L / VAC-R to 24VAC</text><text x="250" y="584" font-size="12" fill="#444">powers the board (on-board DC-DC)</text>
<line x1="40" y1="609" x2="70" y2="609" stroke="#7b3fe4" stroke-width="5" stroke-linecap="round"/>
<text x="82" y="614" font-size="13" font-weight="700" fill="#7b3fe4">REM to REM</text><text x="250" y="614" font-size="12" fill="#444">sends ROAM remote commands</text>
<line x1="40" y1="639" x2="70" y2="639" stroke="#e08a00" stroke-width="5" stroke-linecap="round"/>
<text x="82" y="644" font-size="13" font-weight="700" fill="#e08a00">SEN-L / SEN-R to SEN</text><text x="250" y="644" font-size="12" fill="#444">opto switch: open = Pause Watering</text>
<line x1="40" y1="669" x2="70" y2="669" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
<text x="82" y="674" font-size="13" font-weight="700" fill="#222222">ZC to C</text><text x="250" y="674" font-size="12" fill="#444">valve common (zone feedback return)</text>
<line x1="40" y1="699" x2="70" y2="699" stroke="#1784F7" stroke-width="5" stroke-linecap="round"/>
<text x="82" y="704" font-size="13" font-weight="700" fill="#1784F7">Z1…Z8 to 1…8</text><text x="250" y="704" font-size="12" fill="#444">reads if each valve is really on</text>
<line x1="40" y1="729" x2="70" y2="729" stroke="#aaaaaa" stroke-width="5" stroke-linecap="round"/>
<text x="82" y="734" font-size="13" font-weight="700" fill="#aaaaaa">P, FREE</text><text x="250" y="734" font-size="12" fill="#444">not used</text>
<text x="40" y="766" font-size="11" fill="#777">SEN: set the X-Core sensor bypass switch to "Active" (needed for Pause Watering).</text>
<rect x="510" y="526" width="470" height="254" rx="14" fill="#f7f8fa" stroke="#d0d4da"/>
<text x="530" y="554" font-size="16" font-weight="700" fill="#111">Power jumper (blue, by POWER)</text>
<rect x="530" y="570" width="24" height="44" rx="4" fill="#1784F7"/><text x="566" y="586" font-size="13" font-weight="700" fill="#222">5V</text><text x="610" y="586" font-size="12" fill="#444">powered from the X-Core 24VAC (installed)</text>
<text x="566" y="608" font-size="13" font-weight="700" fill="#222">N/C</text><text x="610" y="608" font-size="12" fill="#444">powered from USB only (bench / flashing)</text>
<text x="530" y="650" font-size="16" font-weight="700" fill="#111">XIAO ESP32-C6 pins (v2)</text>
<text x="530" y="676" font-size="12" font-weight="700" fill="#0f63c4">Z1 Z2 Z3</text><text x="640" y="676" font-size="12" fill="#333">D0 D1 D2 · GPIO 0 1 2</text>
<text x="530" y="696" font-size="12" font-weight="700" fill="#0f63c4">Z4 Z5</text><text x="640" y="696" font-size="12" fill="#333">D6 D7 · GPIO 16 17</text>
<text x="530" y="716" font-size="12" font-weight="700" fill="#0f63c4">Z6 Z7 Z8</text><text x="640" y="716" font-size="12" fill="#333">D8 D9 D10 · GPIO 19 20 18</text>
<text x="530" y="736" font-size="12" font-weight="700" fill="#0f63c4">REM</text><text x="640" y="736" font-size="12" fill="#333">D3 · GPIO 21 *</text>
<text x="530" y="756" font-size="12" font-weight="700" fill="#0f63c4">SEN (Pause)</text><text x="640" y="756" font-size="12" fill="#333">D4 · GPIO 22, inverted</text>
<text x="530" y="776" font-size="11" fill="#777">Board boot log 07/11/2026. * REM not yet tested on the controller.</text>
