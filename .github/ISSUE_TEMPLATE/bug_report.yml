name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: dropdown
    id: board
    attributes:
      label: Board version
      options: ["v2.0.0 (XIAO ESP32-C6)", "v1.1.1", "v1.1.0", "v1.0.0"]
    validations: { required: true }
  - type: input
    id: xcore
    attributes:
      label: Controller model
      placeholder: "Hunter X-Core XC-401i-E"
  - type: input
    id: firmware
    attributes:
      label: Firmware Version (from the device's diagnostic entities)
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options: ["Web installer", "Adopted in the ESPHome Device Builder", "Own YAML"]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From http://<device-ip>/ or the Device Builder.
      render: text
