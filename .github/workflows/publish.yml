name: Build firmware & publish installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Called by esphome-auto-update and auto-release. Tag pushes with GITHUB_TOKEN
  # do not trigger this workflow, so those callers invoke it after they create the tag.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and build (branch, SHA, or tag such as v0.1.16)
        required: true
        type: string
      release:
        description: If true, deploy Pages, create the GitHub release and move stable, like a tag push
        required: false
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Fail the build if a firmware image uses more than this % of its app partition.
  # Tiago wants to lower it to 80 later; change only this number.
  APP_SIZE_MAX_PCT: 90
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # One installer build per board; each board has its own folder (and manifest.json) on
    # GitHub Pages: firmware/v1/ and firmware/v2/. The installer firmware is built from the
    # *.factory.yaml (base config + "Firmware Update" entity).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: v1
            base: devices/hunter-ls-v1.yaml
            factory: devices/hunter-ls-v1.factory.yaml
            site_dir: firmware/v1
            app_partition: 1044464   # ESP8266 d1_mini (eagle.flash.4m.ld): max OTA sketch size 0xFEFF0
          - key: v2
            base: devices/hunter-ls-v2.yaml
            factory: devices/hunter-ls-v2.factory.yaml
            site_dir: firmware/v2
            app_partition: 1835008   # ESP32-C6 4 MB: app0/app1 OTA partitions 0x1C0000
    env:
      BASE_YAML: ${{ matrix.base }}
      DEVICE_YAML: ${{ matrix.factory }}
      SITE_DIR: ${{ matrix.site_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: The tag must match project_version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_call' && inputs.release)
        env:
          TAG_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          tag="${TAG_NAME##*/}"
          tag="${tag#v}"
          grep -q "^\s*project_version: \"${tag}\"$" "$BASE_YAML" || {
            echo "::error::$BASE_YAML project_version does not match tag $TAG_NAME"; exit 1; }
      - name: Record the build source (shown in the "Firmware Version" sensor)
        env:
          RELEASE_TAG: ${{ (github.event_name == 'workflow_call' && inputs.release && inputs.ref) || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ -n "$RELEASE_TAG" ]]; then src="release"
          else src="${GITHUB_REF_NAME} @${GITHUB_SHA::7}"; fi
          sed -i "s|^\(\s*firmware_source:\).*|\1 \"$src\"|" "$BASE_YAML"
          grep -n "firmware_source:\|project_version:" "$BASE_YAML"
      - id: pin
        run: echo "version=$(tr -d '[:space:]' < .github/esphome-version)" >> "$GITHUB_OUTPUT"
      - id: esphome
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: ${{ env.DEVICE_YAML }}
          version: ${{ steps.pin.outputs.version }}
          complete-manifest: true
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases
      - name: Firmware size check (app image vs app partition)
        env:
          FW_DIR: ${{ steps.esphome.outputs.name }}
          APP_PARTITION: ${{ matrix.app_partition }}
          BOARD: ${{ matrix.key }}
        run: |
          f=$(find "$FW_DIR" -name '*.ota.bin' | head -n1)
          test -n "$f" || { echo "::error::no *.ota.bin in $FW_DIR"; exit 1; }
          size=$(stat -c %s "$f")
          pct=$(awk -v s="$size" -v p="$APP_PARTITION" 'BEGIN{printf "%.1f", 100*s/p}')
          free=$((APP_PARTITION - size))
          msg="$BOARD: $(basename "$f") $size bytes of $APP_PARTITION ($pct%, $free bytes free, limit $APP_SIZE_MAX_PCT%)"
          echo "$msg"
          {
            echo "### Firmware size ($BOARD)"
            echo "| Image | Bytes | App partition | Used | Limit |"
            echo "|---|---|---|---|---|"
            echo "| $(basename "$f") | $size | $APP_PARTITION | $pct% | $APP_SIZE_MAX_PCT% |"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v s="$size" -v p="$APP_PARTITION" -v m="$APP_SIZE_MAX_PCT" 'BEGIN{exit !(100*s > m*p)}'; then
            echo "::error::$msg — over the limit"
            exit 1
          fi
      - name: Stage the firmware in its Pages folder
        run: |
          mkdir -p "out/$SITE_DIR"
          cp -r "${{ steps.esphome.outputs.name }}"/* "out/$SITE_DIR/"
          ls -R out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fw-${{ matrix.key }}
          path: out
          if-no-files-found: error
  pages:
    if: github.event_name != 'workflow_call' || inputs.release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: site
      - name: Assemble Pages site
        run: |
          cp -r static/. site/
          ls -R site
          test -f site/firmware/v1/manifest.json
          test -f site/firmware/v2/manifest.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Build documentation (MkDocs → site/docs)
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict -d site/docs
          test -f site/docs/index.html
          test -f site/docs/pt/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    # Publish the installer and the OTA manifests only for release tags (or a manual run), so
    # devices in the field only ever see releases.
    if: (github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_call' && inputs.release)
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  release:
    # GitHub Release for a v* tag: notes from CHANGELOG.md, firmware images attached.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_call' && inputs.release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fw-*
          merge-multiple: true
          path: fw
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f&&/^\[[^]]+\]: /{exit} f{print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No '## [$v]' section in CHANGELOG.md"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi
          sed -i -E "s#\]\(([^):#][^):]*)\)#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" notes.md
          {
            echo
            echo "---"
            echo "**Install or update:** use the [web installer](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/) (Chrome or Edge)."
            echo "Boards already running this firmware update over the air from the **Firmware Update** entity."
            echo "\`*.factory.bin\` is the full image for a first USB flash at offset 0x0; \`*.ota.bin\` is for manual OTA uploads."
          } >> notes.md
          cat notes.md
      - name: Prepare assets
        run: |
          mkdir assets
          for d in v1 v2; do
            for f in $(find "fw/firmware/$d" -name '*.factory.bin' -o -name '*.ota.bin' | sort); do
              b=$(basename "$f"); cp "$f" "assets/hunter-ls-$d-${TAG}.${b#*.}"
            done
          done
          test "$(ls assets | wc -l)" -ge 4
          (cd assets && sha256sum * > SHA256SUMS.txt)
          ls -l assets && cat assets/SHA256SUMS.txt
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
  stable:
    # Move the "stable" branch to this release tag. Adopted Device Builder configs import
    # devices/hunter-ls-vN.yaml@stable, so "Install" builds the latest release.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_call' && inputs.release)
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Point refs/heads/stable at the tag commit
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          tag="${TAG##*/}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${tag}" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$sha" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$sha"
          fi
          echo "stable -> $tag ($sha)"
