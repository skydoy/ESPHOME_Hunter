name: Auto-release on firmware change

# A push to main that changes the firmware (devices/, core/ or hunter/) cuts a
# patch release once the build of both boards passes, including the app-size
# check. Docs, READMEs and the web installer do not release.
# If the commit already bumped project_version, this workflow only tags and
# publishes. If the build fails, no tag is pushed and there is no release.
# Manual tag releases keep working unchanged.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.pt.md"
      - "static/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "requirements-docs.txt"
      - ".github/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "hardware/**"
      - "tools/**"
      - "blueprints/**"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan the release but do not commit, tag or publish
        type: boolean
        default: false

concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  AUTHOR_NAME: skydoy
  AUTHOR_EMAIL: 25871317+skydoy@users.noreply.github.com

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{k}={v}\n")
              print(f"{k}={v}")

          dry = os.environ.get("DRY_IN", "false").lower() == "true"
          out("dry_run", "true" if dry else "false")

          def project_version():
              vals = []
              for yaml in ("devices/hunter-ls-v1.yaml", "devices/hunter-ls-v2.yaml"):
                  m = re.search(r'^\s*project_version: "([^"]+)"', Path(yaml).read_text(), re.M)
                  if not m:
                      raise SystemExit(f"no project_version in {yaml}")
                  vals.append(m.group(1))
              if vals[0] != vals[1]:
                  raise SystemExit(f"project_version mismatch: {vals}")
              return vals[0]

          def ver_t(v):
              return tuple(int(x) for x in v.split("."))

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tags_here = subprocess.check_output(
              ["git", "tag", "--points-at", "HEAD"], text=True
          ).split()
          rel_tags = [t for t in tags_here if re.fullmatch(r"v\d+\.\d+\.\d+", t)]
          if rel_tags:
              print(f"HEAD is already tagged {rel_tags}, nothing to do")
              out("should_release", "false")
              out("ref", head)
              out("tag", rel_tags[0])
              raise SystemExit(0)

          latest_tag = subprocess.check_output(
              ["git", "tag", "-l", "v*", "--sort=-v:refname"], text=True
          ).splitlines()
          latest_tag = next((t for t in latest_tag if re.fullmatch(r"v\d+\.\d+\.\d+", t)), "")
          tag_ver = latest_tag[1:] if latest_tag.startswith("v") else ""
          current = project_version()
          print(f"HEAD={head} project={current} latest_tag={latest_tag or '(none)'}")

          already_bumped = bool(tag_ver) and ver_t(current) > ver_t(tag_ver)
          if not tag_ver:
              already_bumped = True  # unusual repo with no tags; tag current as-is

          if already_bumped:
              tag = f"v{current}"
              if subprocess.call(["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) == 0:
                  print(f"Tag {tag} already exists; skip")
                  out("should_release", "false")
                  out("ref", head)
                  out("tag", tag)
                  raise SystemExit(0)
              reason = f"project_version {current} is ahead of {latest_tag}; will tag {tag} at HEAD."
              out("should_release", "false" if dry else "true")
              out("ref", head)
              out("tag", tag)
              print(reason)
              if dry:
                  print("Dry run: not tagging or publishing.")
              raise SystemExit(0)

          if not already_bumped and latest_tag:
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", latest_tag, "HEAD"], text=True
              ).splitlines()
              firmware = [f for f in diff if f.startswith(("devices/", "core/", "hunter/"))]
              if not firmware:
                  print(f"No firmware path changes since {latest_tag}; skip")
                  out("should_release", "false")
                  out("ref", head)
                  out("tag", latest_tag)
                  raise SystemExit(0)

          # Same version as the latest tag: bump a patch, on a side branch so main
          # is unchanged if the build later fails.
          parts = current.split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          new = ".".join(parts)
          tag = f"v{new}"
          branch = f"ci/auto-release-{new}"
          reason = f"Firmware changed without a version bump; will prepare {tag} on {branch}."
          print(reason)
          out("tag", tag)
          if dry:
              out("should_release", "false")
              out("ref", head)
              print("Dry run: not committing, tagging or publishing.")
              raise SystemExit(0)

          # Prepare the bump on a branch; CI runs against that ref, then we merge.
          subprocess.check_call(["git", "config", "user.name", os.environ["AUTHOR_NAME"]])
          subprocess.check_call(["git", "config", "user.email", os.environ["AUTHOR_EMAIL"]])
          subprocess.check_call(["git", "checkout", "-B", branch])

          date = os.popen("TZ=Europe/Lisbon date +%F").read().strip()
          for yaml in ("devices/hunter-ls-v1.yaml", "devices/hunter-ls-v2.yaml"):
              p = Path(yaml)
              text, n = re.subn(
                  r'(^\s*project_version: ")[^"]+(")',
                  rf"\g<1>{new}\2",
                  p.read_text(),
                  count=1,
                  flags=re.M,
              )
              if n != 1:
                  raise SystemExit(f"failed to bump project_version in {yaml}")
              p.write_text(text)

          sec = Path("SECURITY.md")
          s = sec.read_text()
          s, n1 = re.subn(
              r"\| `[^`]+` \(current release\) \| ✅ \|",
              f"| `{new}` (current release) | ✅ |",
              s,
              count=1,
          )
          s, n2 = re.subn(
              r"\| `[^`]+` and older \| ❌ \|",
              f"| `{current}` and older | ❌ |",
              s,
              count=1,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"failed to update SECURITY.md ({n1}, {n2})")
          sec.write_text(s)

          cl = Path("CHANGELOG.md")
          text = cl.read_text()
          m = re.search(r"(## \[Unreleased\]\s*\n)(.*?)(\n## \[)", text, re.S)
          if not m:
              raise SystemExit("no Unreleased section in CHANGELOG.md")
          unreleased = m.group(2).strip()
          body = "### Changed\n- Patch release of firmware changes on main."
          parts_txt = [body]
          if unreleased:
              parts_txt.append(unreleased)
          section = f"## [{new}] - {date}\n" + "\n\n".join(parts_txt) + "\n"
          text = text[:m.start()] + m.group(1) + "\n" + section + m.group(3) + text[m.end():]
          old_link = f"[Unreleased]: https://github.com/skydoy/ESPHOME_Hunter/compare/v{current}...HEAD"
          new_links = (
              f"[Unreleased]: https://github.com/skydoy/ESPHOME_Hunter/compare/v{new}...HEAD\n"
              f"[{new}]: https://github.com/skydoy/ESPHOME_Hunter/compare/v{current}...v{new}"
          )
          if old_link not in text:
              raise SystemExit("Unreleased compare link not found in CHANGELOG.md")
          text = text.replace(old_link, new_links, 1)
          cl.write_text(text)

          subprocess.check_call([
              "git", "add",
              "devices/hunter-ls-v1.yaml", "devices/hunter-ls-v2.yaml",
              "SECURITY.md", "CHANGELOG.md",
          ])
          subprocess.check_call(["git", "commit", "-m", f"release v{new}: firmware changes on main"])
          subprocess.check_call(["git", "push", "-u", "origin", branch])
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          out("should_release", "true")
          out("ref", branch)
          print(f"Prepared {tag} on {branch} ({sha})")
          PY

  validate:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
    permissions:
      contents: read

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      release: false
    # GitHub checks every job in the reusable workflow against these permissions,
    # including deploy/release/stable which are skipped when release is false.
    permissions:
      contents: write
      pages: write
      id-token: write

  tag:
    needs: [prepare, validate, build]
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git fetch origin main --tags
          # Tag the commit we compiled, not whatever main happens to be later.
          sha=$(git rev-parse HEAD)
          if [ "$(git rev-parse origin/main)" != "$sha" ]; then
            git checkout -B main origin/main
            git merge --ff-only "$sha"
            git push origin main
            if [[ "$REF" == ci/auto-release-* ]]; then
              git push origin --delete "$REF" || true
            fi
          fi
          git tag -a "$TAG" -m "$TAG" "$sha"
          git push origin "refs/tags/$TAG"
          echo "Tagged $TAG at $sha"

  publish:
    needs: [prepare, tag]
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true
    permissions:
      contents: write
      pages: write
      id-token: write
