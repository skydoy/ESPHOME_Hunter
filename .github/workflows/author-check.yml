name: Commit author
on: [pull_request]
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Every PR commit uses the project author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          want='skydoy <25871317+skydoy@users.noreply.github.com>'
          bad=$(git log --format='%h %an <%ae>' "$BASE..$HEAD" | grep -vF " $want" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits must use the author '$want' (see CONTRIBUTING.md):"
            echo "$bad"
            exit 1
          fi
          echo "All commits use $want"
