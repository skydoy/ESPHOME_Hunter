# Local web page at http://<device-ip>/ : zones, programs, status and live logs.
# Version 3 UI served from the ESPHome CDN (little flash). NO authentication: anyone on the LAN
# can start or stop zones. To add a login set `web_server: auth:` in your own config; to remove
# the page, override the package with `web_server: !remove`. See docs/configuration.md.
web_server:
  port: 80
  version: 3
  log: true
  sorting_groups:
    - id: group_zones
      name: "Zones"
      sorting_weight: 10
    - id: group_programs
      name: "Programs"
      sorting_weight: 20
    - id: group_settings
      name: "Settings"
      sorting_weight: 30
    - id: group_maintenance
      name: "Maintenance"
      sorting_weight: 90
