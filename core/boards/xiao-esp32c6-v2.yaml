# Board: Hunter_LS v2.0.0 (black PCB) with a Seeed Studio XIAO ESP32-C6, up to 8 zones.
#
# Pin map RECOVERED FROM LUIS SOARES'S OWN v2.0.0 FIRMWARE (ESPHome 2026.6.2, project
# "hunterls8v2"): the GPIO numbers, directions and inversion below are the ones his compiled
# firmware configures. Not yet re-tested on a board with THIS firmware; please report results.
# Wrong pins cannot damage anything (every line is opto-isolated); zones would just not start
# or report.
#
#   XIAO pin -> GPIO : function                       (confidence)
#   D0 -> GPIO0  : zone 1 feedback (input, pull-up, inverted)   high
#   D1 -> GPIO1  : zone 2 feedback                              high
#   D2 -> GPIO2  : zone 3 feedback                              high
#   D3 -> GPIO21 : REM, Hunter ROAM data (output)               medium-high
#   D4 -> GPIO22 : SEN, "Pause Watering" (output, inverted)     high
#   D5 -> GPIO23 : free
#   D6 -> GPIO16 : zone 4 feedback                              high
#   D7 -> GPIO17 : zone 5 feedback                              high
#   D8 -> GPIO19 : zone 6 feedback                              high
#   D9 -> GPIO20 : zone 7 feedback                              high
#   D10 -> GPIO18: zone 8 feedback                              high
#   GPIO15 = user LED (status), GPIO3 = RF switch power, GPIO14 = antenna select
#
# Hunter ROAM driver: luisfosoares/Hunter_ESP_IDF (Luís's ESP-IDF port of the ROAM component,
# with timings he tuned for this board), pinned to a commit.
substitutions:
  board_label: "Hunter_LS v2.0.0 (XIAO ESP32-C6)"
  rem_pin: GPIO21
  sen_pin: GPIO22
  zone1_pin: GPIO0
  zone2_pin: GPIO1
  zone3_pin: GPIO2
  zone4_pin: GPIO16
  zone5_pin: GPIO17
  zone6_pin: GPIO19
  zone7_pin: GPIO20
  zone8_pin: GPIO18
  zone_on_delay: 50ms
  zone_off_delay: 500ms
  http_verify_ssl: "true"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/luisfosoares/Hunter_ESP_IDF
      ref: 9e765a475cd18e2dc1a230502680e0785120ed4f
    components: [hunter_roam_esp_idf]
    refresh: never

hunter_roam_esp_idf:
  id: hunter
  pin:
    number: ${rem_pin}
    inverted: false

# Wi-Fi setup over Bluetooth (Improv) from the Home Assistant app or improv-wifi.com.
improv_ble:
  authorizer: none

status_led:
  pin:
    number: GPIO15
    inverted: true
    ignore_strapping_warning: true

# XIAO ESP32-C6 RF switch: GPIO3 LOW powers it, GPIO14 selects the antenna
# (LOW = on-board ceramic antenna, HIGH = u.FL connector). "External Antenna" is off by default.
output:
  - platform: gpio
    id: rf_switch_power
    pin: GPIO3
  - platform: gpio
    id: rf_antenna_select
    pin: GPIO14

esphome:
  on_boot:
  - priority: 800
    then:
      - output.turn_off: rf_switch_power
      - lambda: |-
          if (id(external_antenna).state) id(rf_antenna_select).turn_on();
          else id(rf_antenna_select).turn_off();
  # Same as Luis's firmware: after a cold power-on (not after a software restart) reboot once
  # 5 s later, to clear a start-up glitch of the board. A warm restart does not loop.
  - priority: -100
    then:
      - if:
          condition:
            lambda: |-
              return esp_reset_reason() == ESP_RST_POWERON;
          then:
            - logger.log: "Cold boot: restarting once in 5 s (clears the power-on glitch)"
            - delay: 5s
            - lambda: App.safe_reboot();

switch:
  - platform: template
    id: external_antenna
    name: "External Antenna"
    icon: mdi:antenna
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - output.turn_on: rf_antenna_select
    turn_off_action:
      - output.turn_off: rf_antenna_select
